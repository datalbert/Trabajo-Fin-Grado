spring:
    application:
        name: "eurekaserver"
    profiles:
      active:
        - default
    config:
        
        import: "optional:configserver:http://configserver-container:8888/"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true

