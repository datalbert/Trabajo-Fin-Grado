spring:
  application:
      name: inventario
  profiles:
      active: dev
  config:
        #import: "optional:configserver:http://configserver-ms:8888/"
        import: "optional:configserver:http://localhost:8888/"
  cloud:
    function:
        definition: sendInventarioConfirmation
    stream:
      bindings:
        sendInventarioConfirmation-in-0:
          destination: inventario-confirmation
      kafka:
        binder:
          brokers: 
            - localhost:9092

