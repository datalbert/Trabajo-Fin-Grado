springdoc:
    enable-native-support: true
    api-docs:
        groups:
            enabled: true
    group-configs:
        0:
            group: "inventario"
            display-name: "Inventario"
            paths-to-match: "/tfg/inventario/*"
        1:
            group: "reservas"
            display-name: "Reservas"
            paths-to-match: "/tfg/reservas/*"
    swagger-ui:
        config-url: /v3/api-docs/swagger-config
        url: /v3/api-docs
        urls:
            0:
                name: Inventario
                url: http://localhost:8081/v3/api-docs/inventario
            1:
                name: Reservas
                url: /v3/api-docs/reservas

       

            
            


                
    
    
                        
            
